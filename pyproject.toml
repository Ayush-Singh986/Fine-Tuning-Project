[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-json-finetuning"
version = "0.1.0"
description = "Structured JSON generation with LoRA SFT, DPO, and evaluation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
inference = [
  "peft>=0.14,<1",
  "torch>=2.5",
  "transformers>=4.50,<4.52",
]
training = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3.2,<4",
  "peft>=0.14,<1",
  "torch>=2.5",
  "transformers>=4.50,<4.52",
  "trl>=0.15,<0.16",
]
test = ["httpx>=0.27,<1"]
download = ["huggingface_hub[hf_xet]>=0.27,<1", "pyarrow>=18,<30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
